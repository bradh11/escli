# GoReleaser builds a static binary for each platform and publishes them to a
# GitHub release when a v* tag is pushed. Try it locally with `make snapshot`.
version: 2

project_name: escli

before:
  hooks:
    - go mod tidy

builds:
  - id: escli
    main: ./cmd/escli
    binary: escli
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/bradh11/escli/internal/version.Version={{ .Version }}
      - -X github.com/bradh11/escli/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/bradh11/escli/internal/version.Date={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # No version in the name, so releases/latest/download/<name> always works.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Publishes a cask to bradh11/homebrew-tap, so that `brew install bradh11/tap/escli`
# works. HOMEBREW_TAP_TOKEN is a token with write access to that repository only.
homebrew_casks:
  - repository:
      owner: bradh11
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/bradh11/escli
    description: Read-only Elasticsearch client for people and AI agents
    license: MIT
    commit_author:
      name: Brad Haas
      email: bradh11@gmail.com
    commit_msg_template: "Update escli to {{ .Tag }}"
    # Homebrew quarantines cask downloads, and Gatekeeper blocks the unsigned
    # binary, so the cask removes the quarantine flag after install.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/escli"]
          end
